<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { 
      width: 280px; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      padding: 14px; 
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .header { display: flex; align-items: center; justify-content: space-between; }
    h4 { margin: 0; font-size: 14px; font-weight: 700; color: #38bdf8; }
    
    /* Toggle Switch */
    .switch { position: relative; display: inline-block; width: 30px; height: 16px; margin-right: 6px;}
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; border-radius: 16px; transition: .3s; }
    .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px; background-color: white; border-radius: 50%; transition: .3s; }
    input:checked + .slider { background-color: #38bdf8; }
    input:checked + .slider:before { transform: translateX(14px); }

    .badge { font-size: 10px; padding: 2px 7px; border-radius: 9999px; background: #1e293b; color: #94a3b8; border: 1px solid #334155; font-weight: 600; }
    textarea { width: 100%; height: 50px; box-sizing: border-box; resize: none; font-size: 12px; padding: 8px; background: #1e293b; color: #f1f5f9; border: 1px solid #334155; border-radius: 6px; outline: none; font-family: inherit; }
    textarea:focus { border-color: #38bdf8; }
    
    button { width: 100%; padding: 9px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; transition: all 0.2s ease; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #scanBtn { background: #0284c7; color: white; }
    #scanBtn:hover:not(:disabled) { background: #0369a1; }
    #visionBtn { background: #f59e0b; color: #0f172a; }
    #visionBtn:hover:not(:disabled) { background: #d97706; }
    
    .panel { display: none; font-size: 11px; background: #1e293b; padding: 8px; border-radius: 6px; border: 1px solid #334155; }
    .status-container { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #94a3b8; min-height: 18px; }
    .spinner { width: 12px; height: 12px; border: 2px solid #334155; border-top: 2px solid #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <h4>SuperNova</h4>
    <div style="display: flex; align-items: center;">
      <label class="switch" title="Agent On/Off">
        <input type="checkbox" id="agentToggle" checked>
        <span class="slider"></span>
      </label>
      <span id="stateBadge" class="badge">READY</span>
    </div>
  </div>
  
  <textarea id="taskInput" placeholder="e.g. Click on the search box..."></textarea>
  
  <div id="actionPanel" class="panel">
    <strong id="actionName" style="color:#34d399;"></strong>
    <div id="actionReason" style="color:#94a3b8; margin-top:4px;"></div>
  </div>

  <div id="redactionPanel" class="panel">
    <div id="redactionText" style="color:#f59e0b; font-weight:600; margin-bottom: 6px;"></div>
    <div id="thumbnails" style="display:flex; gap:8px;">
      <div style="flex:1;"><div style="color:#94a3b8; font-size:9px; margin-bottom:2px;">Original</div><img id="thumbBefore" style="width:100%; border-radius:4px; border:1px solid #334155;"></div>
      <div style="flex:1;"><div style="color:#94a3b8; font-size:9px; margin-bottom:2px;">Redacted</div><img id="thumbAfter" style="width:100%; border-radius:4px; border:1px solid #334155;"></div>
    </div>
  </div>

  <button id="scanBtn">Execute Task (DOM)</button>
  <button id="visionBtn">Run Local Vision AI</button>

  <div class="status-container">
    <div id="statusSpinner" class="spinner"></div>
    <span id="statusText">Agent standing by.</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
